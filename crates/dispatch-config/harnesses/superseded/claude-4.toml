id = "claude"
icon = ""
display_name = "Claude Code"
command = "claude"
args = []

# `claude` installs on Windows as a claude.cmd shim, which CreateProcess
# cannot execute directly.
[platform.windows]
command = "cmd.exe"
args = ["/c", "claude"]

[task]
args = ["-p", "{task}"]

[task.platform.windows]
args = ["/c", "claude", "-p", "{task}"]

[[settings]]
key = "model"
label = "Model"
kind = "choice"
options = ["default", "opus", "sonnet", "haiku"]
default = "default"

[[settings]]
key = "permission_mode"
label = "Permission mode"
kind = "choice"
options = ["default", "acceptEdits", "plan"]
default = "default"
