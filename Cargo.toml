[workspace]
resolver = "3"
members = [
    "crates/dispatch-client",
    "crates/dispatch-core",
    "crates/dispatch-layout",
    "crates/dispatch-config",
    "crates/dispatch-daemon",
    "crates/dispatch-os",
    "crates/dispatch-proto",
    "crates/dispatch-pty",
    "crates/dispatch-tui",
    "dispatch",
    "dispatchd",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/namelessmonarch/dispatch"

[workspace.dependencies]
# Internal
dispatch-client = { path = "crates/dispatch-client" }
dispatch-core = { path = "crates/dispatch-core" }
dispatch-layout = { path = "crates/dispatch-layout" }
dispatch-config = { path = "crates/dispatch-config" }
dispatch-daemon = { path = "crates/dispatch-daemon" }
dispatch-os = { path = "crates/dispatch-os" }
dispatch-proto = { path = "crates/dispatch-proto" }
dispatch-pty = { path = "crates/dispatch-pty" }
dispatch-tui = { path = "crates/dispatch-tui" }

# Interface
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, the exact
# wrapped row count the render path itself computes. Three attempts at
# reimplementing that count by hand (a character sum, a per-line `div_ceil`,
# a two-row probe) were each wrong in a way tests at only one terminal width
# missed; the version is pinned, so "unstable" here means "the API may move
# under us later," not "unverified now."
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net", "io-util"] }

# PTY
portable-pty = "0.9"

# Platform
directories = "6"
libc = "0.2"

# Data
serde = { version = "1", features = ["derive"] }
toml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
png = "0.17"

# Diagnostics
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Test
insta = "1"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
