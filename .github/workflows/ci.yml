name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must cost minutes, not the six-hour default: this suite drives
    # real processes over a real socket, and one that never answers used to take
    # the whole job with it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Windows uses the GNU ABI so Zig supplies its own MinGW libc and
          # contributors need no Visual Studio install. See docs: upstream
          # Ghostty marks x86_64-windows-msvc as not working.
          - os: windows-latest
            target: x86_64-pc-windows-gnu

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify Zig
        run: zig version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        # --no-fail-fast because cargo otherwise stops at the first failing test
        # binary: a Windows failure in one integration suite hid the results of
        # every other suite on that platform, including the ones that would say
        # whether the transport works at all.
        env:
          # The client and the daemon log to files inside each test's temporary
          # directory, and a failing test prints them. Debug detail therefore
          # costs nothing on a green run and is the difference between "the
          # handshake never arrived" and knowing which side dropped it — which
          # matters most on the platform that cannot be reproduced locally.
          RUST_LOG: debug
        run: cargo test --workspace --no-fail-fast --target ${{ matrix.target }}

  msrv:
    name: msrv (1.89)
    # The floor `rust-version` advertises, built exactly. `stable` moves every
    # six weeks and would never notice a let chain or a new std API arriving
    # under a floor that says otherwise -- which is how 1.85 went stale.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Build
        run: cargo build --workspace --all-targets --locked
